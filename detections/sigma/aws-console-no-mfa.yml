title: AWS Successful Console Login Without MFA
id: 8a7d441b-870b-4fce-bac4-000000000004
status: experimental
description: Successful aws successful console login without mfa; behavioral signal, not proof of malicious intent. Raw provider field contract; synthetic tests only.
author: 1xLoZec
date: 2026-10-14
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: "signin.amazonaws.com"
    eventName: "ConsoleLogin"
    responseElements.ConsoleLogin: "Success"
    additionalEventData.MFAUsed: "No"
  success:
    errorCode: null
  condition: selection and success
falsepositives:
  - Authorized administration or legitimate activity; require actor and change-ticket review.
level: high
