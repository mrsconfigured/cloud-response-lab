<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Log</title><link rel="icon" href="data:,">
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;--text:#e6edf3;--muted:#9aa7b4;--accent:#58a6ff;--green:#3fb950;--chip:#21262d;--mark:#5c4a00}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(14,17,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px 12px}
.wrap{max-width:900px;margin:0 auto}
h1{margin:0 0 2px;font-size:22px;letter-spacing:.2px}.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.search{position:relative}
.search input{width:100%;padding:13px 44px 13px 44px;font-size:17px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.18)}
.search .ico{position:absolute;left:15px;top:13px;color:var(--muted);line-height:0}
.search .clear{position:absolute;right:10px;top:8px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:6px 13px;border-radius:999px;font-size:14px;cursor:pointer}
.chip small{color:var(--muted);margin-left:4px}.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#06101c;border-color:var(--accent)}.chip.on small{color:#06101c}
main{padding:8px 20px 80px}
.status{color:var(--muted);font-size:14px;margin:16px 0 4px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:30px 0 10px;display:flex;align-items:center;gap:10px}
h2 span{background:var(--chip);color:var(--text);border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.cmd{display:flex;gap:10px;align-items:stretch}
.cmd code{flex:1;overflow-x:auto;white-space:pre;background:#0a0d12;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font:15px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d2e3ff}
.copy{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:0 14px;font-size:14px;cursor:pointer;min-width:84px}
.copy:hover{border-color:var(--accent)}.copy.ok{background:var(--green);color:#04130a;border-color:var(--green)}
.gloss{margin:11px 0 2px;font-weight:600}
.row{margin-top:8px;color:#cfd8e1}.row b{color:var(--text);display:inline-block;min-width:104px;color:var(--accent);font-weight:600}
.meta{margin-top:10px;color:var(--muted);font-size:12.5px}
.entry{scroll-margin-top:200px}
.entry.flash{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.28)}
mark{background:var(--mark);color:#fff;border-radius:3px;padding:0 2px}
.empty{text-align:center;color:var(--muted);padding:60px 10px}.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:30px 0}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px}
@media(max-width:560px){.cmd{flex-direction:column}.copy{padding:9px}.row b{display:block}}
</style></head><body>
<header><div class="wrap">
<h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:8px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Learning Log</h1><div class="sub" id="count">Loading…</div>
<div class="search"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input id="q" type="text" autocomplete="off" placeholder="Search commands or words…" aria-label="Search the learning log"><button class="clear" id="clr" aria-label="Clear search">×</button></div>
<div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap"><div class="status" id="status"></div><div id="list"></div></div></main>
<footer>Press <kbd>/</kbd> to search · click <b>Copy</b> on any command · updates by itself when a new entry is added · private network only</footer>
<script>
(function(){
var DATA={entries:[]},topic='all',term='',lastStamp='';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function toks(){return term.toLowerCase().split(/\s+/).filter(Boolean)}
function hay(e){return [e.command,e.topic,e.gloss,e.what,e.when,e.goal||''].join(' ').toLowerCase()}
function hl(text){var t=toks().filter(function(x){return x.length>0});var s=esc(text);if(!t.length)return s;
 t.sort(function(a,b){return b.length-a.length});
 t.forEach(function(w){var re=new RegExp('('+w.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&').replace(/&/g,'&amp;')+')','gi');s=s.replace(new RegExp('(<mark>.*?</mark>)|'+re.source,'gi'),function(m,a,b){return a?a:'<mark>'+m+'</mark>'})});return s}
function topicsOf(list){var order=['git','python','pytest','pull request','tailscale','elastic','shuffle'],seen={};list.forEach(function(e){(seen[e.topic]=seen[e.topic]||[]).push(e)});
 var keys=Object.keys(seen),first=order.filter(function(t){return seen[t]}),rest=keys.filter(function(t){return order.indexOf(t)<0}).sort();return first.concat(rest).map(function(t){return [t,seen[t]]})}
function copyText(text,btn){function ok(){btn.textContent='Copied \u2713';btn.classList.add('ok');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('ok')},1400)}
 function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){btn.textContent='Press Ctrl+C'}document.body.removeChild(ta)}
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback)}else{fallback()}}
function renderChips(){var all=DATA.entries,groups=topicsOf(all),h='<button class="chip'+(topic==='all'?' on':'')+'" data-t="all">All<small>'+all.length+'</small></button>';
 groups.forEach(function(g){h+='<button class="chip'+(topic===g[0]?' on':'')+'" data-t="'+esc(g[0])+'">'+esc(cap(g[0]))+'<small>'+g[1].length+'</small></button>'});$('chips').innerHTML=h}
function render(){var t=toks(),all=DATA.entries;
 var list=all.filter(function(e){return (topic==='all'||e.topic===topic)&&t.every(function(w){return hay(e).indexOf(w)>-1})});
 var groups=topicsOf(list),n=all.length,m=topicsOf(all).length;
 $('count').textContent=n+' entr'+(n===1?'y':'ies')+' \u00b7 '+m+' topic'+(m===1?'':'s');
 $('status').textContent=(t.length||topic!=='all')?(list.length+' match'+(list.length===1?'':'es')+(t.length?' for \u201c'+term+'\u201d':'')+(topic!=='all'?' in '+cap(topic):'')):'';
 $('clr').style.display=term?'block':'none';
 if(!list.length){$('list').innerHTML=n?'<div class="empty"><b>Nothing matches</b>Try a shorter word, or pick All.</div>':'<div class="empty"><b>No entries yet</b>Add the first one from #learning-log in Discord.</div>';return}
 var h='';groups.forEach(function(g){h+='<h2>'+esc(cap(g[0]))+'<span>'+g[1].length+'</span></h2>';
  g[1].forEach(function(e){h+='<div class="entry" id="'+esc(e.id)+'"><div class="cmd"><code>'+hl(e.command)+'</code><button class="copy" data-c="'+esc(e.id)+'">Copy</button></div>'+
   '<div class="gloss">'+hl(e.gloss)+'</div><div class="row"><b>What it does</b> '+hl(e.what)+'</div><div class="row"><b>When to use it</b> '+hl(e.when)+'</div>'+
   (e.goal?'<div class="row"><b>Added because</b> '+hl(e.goal)+'</div>':'')+'<div class="meta">Added by '+esc(e.added_by)+' \u00b7 '+esc((e.added_at||'').slice(0,10))+'</div></div>'})});
 $('list').innerHTML=h}
function jump(){var id=(location.hash||'').slice(1);if(!id)return;var el=document.getElementById(id);if(!el){term='';topic='all';$('q').value='';render();el=document.getElementById(id)}if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}
window.addEventListener('hashchange',function(){jump()});
function load(){fetch('learning-log.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(txt){if(txt===lastStamp)return;lastStamp=txt;DATA=JSON.parse(txt);renderChips();render();jump()}).catch(function(){if(!DATA.entries.length)$('count').textContent='Could not load the log. Are you connected to the private network?'})}
$('q').addEventListener('input',function(e){term=e.target.value;render()});
$('clr').addEventListener('click',function(){term='';$('q').value='';render();$('q').focus()});
$('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;topic=b.getAttribute('data-t');renderChips();render()});
$('list').addEventListener('click',function(e){var b=e.target.closest('.copy');if(!b)return;var id=b.getAttribute('data-c'),en=DATA.entries.filter(function(x){return x.id===id})[0];if(en)copyText(en.command,b)});
document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}if(e.key==='Escape'){term='';$('q').value='';render()}});
load();setInterval(load,20000);
})();
</script></body></html>
